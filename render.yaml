services:
  - type: web
    name: blasfen-site
    env: static
    buildCommand: "echo 'Site estático, sem build necessário'"
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.google.com https://maps.google.com; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests"
    routes:
      # URLs amigáveis (o Render não lê o .htaccess, então essas rotas substituem a regra 3 dele)
      - type: rewrite
        source: /sobre
        destination: /sobre.html
      - type: rewrite
        source: /contato
        destination: /contato.html
      - type: rewrite
        source: /obrigado
        destination: /obrigado.html
      - type: rewrite
        source: /politica-de-privacidade
        destination: /politica-de-privacidade.html
      - type: rewrite
        source: /termos-de-uso
        destination: /termos-de-uso.html
      - type: rewrite
        source: /produtos/desengraxantes
        destination: /produtos/desengraxantes.html
      - type: rewrite
        source: /produtos/eco-spray-desengripante
        destination: /produtos/eco-spray-desengripante.html
      - type: rewrite
        source: /produtos/florestal
        destination: /produtos/florestal.html
      - type: rewrite
        source: /produtos/graxas-lubrificantes-especiais
        destination: /produtos/graxas-lubrificantes-especiais.html
      - type: rewrite
        source: /produtos/industria-plasticos
        destination: /produtos/industria-plasticos.html
      - type: rewrite
        source: /produtos/metalworking
        destination: /produtos/metalworking.html
      - type: rewrite
        source: /produtos/pastas-de-montagem
        destination: /produtos/pastas-de-montagem.html
